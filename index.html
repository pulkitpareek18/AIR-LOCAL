<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AirLocal — instant device-to-device file transfer on your local network. No uploads, no accounts." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AirLocal — AirDrop for Android and every device" />
    <meta property="og:description" content="Private, direct file sharing between devices on the same network. No uploads. No accounts." />
    <meta property="og:image" content="/og-image.svg" />

    <meta property="og:image:alt" content="AirLocal — private, direct file sharing between devices on the same network" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fafafa' stroke-width='2'><path d='M8 3 4 7l4 4'/><path d='M4 7h16'/><path d='m16 21 4-4-4-4'/><path d='M20 17H4'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      (() => {
        const preference = localStorage.getItem('airlocal.theme') || 'device';
        const dark = preference === 'dark' || (preference === 'device' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
      })();
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body class="bg-background text-foreground font-sans min-h-screen flex flex-col antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
